name: Media3 library Build Main

on:
     workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PROJECT_USER: "l1068org"
      PROJECT_NAME: "media"
      MEDIA3_BRANCH: "r1.11.0-0.0.8-2"
      FFMPEG_BRANCH: "release-9.0-fongmi"
    
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-java@v5
      with:
          distribution: 'temurin'
          java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
     
    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
          ndk-version: r29
          local-cache: false
          add-to-path: true

    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

    - uses: ilammy/setup-nasm@v1
    - name: Install Meson
      run: pip3 install --user meson
      
    - name: Check out exact Media3 source
      run: |
          git clone --depth 1 -b release https://github.com/androidx/media.git media
          
    - name: Build ffmpeg
      continue-on-error: false
      env:
          ANDROID_NDK_HOME: ${{steps.setup-ndk.outputs.ndk-path }}
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
          set -x
          echo "NDK_PATH=${NDK_PATH}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"
          ls -la "${NDK_PATH}/" || echo "NDK_PATH dir not found"
          ls "${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -5 || echo "toolchain not found"
          echo "---"
          bash -x ${{ github.workspace }}/.github/scripts/build.sh 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}

    # Upload FFmpeg static libs
    - name: Upload FFmpeg Static Libs
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
          name: "ffmpeg-libs"
          path: ${{ github.workspace }}/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/android-libs

    # Build all AARs
    - name: Build AARs
      run: |
          chmod +x gradlew          
          ./gradlew :lib-decoder-ffmpeg:assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log
  
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
          name: build-logs
          path: |
            gradle-build.log
            /tmp/build.log
          retention-days: 7

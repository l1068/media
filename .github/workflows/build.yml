name: Media3 library Build 

on:
   push:
     branches: [ "test" ]
   pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PROJECT_USER: "l1068org"
      PROJECT_NAME: "media"
      MEDIA3_BRANCH: "r1.11.0-0.0.8-2"
      FFMPEG_BRANCH: "release-9.0-fongmi"
    
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-java@v5
      with:
          distribution: 'temurin'
          java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
     
    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
          ndk-version: r29
          local-cache: false
          add-to-path: true

    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

    - uses: ilammy/setup-nasm@v1
    - name: Install Meson
      run: pip3 install --user meson

    - name: Build ffmpeg
      continue-on-error: false
      env:
          ANDROID_NDK_HOME: ${{steps.setup-ndk.outputs.ndk-path }}
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
          ROOT_DIR: ${{ github.workspace }}
      run: |       
        echo "*** Setting up Media3 ***"
        git clone -b $MEDIA3_BRANCH https://github.com/$PROJECT_USER/$PROJECT_NAME.git
        
        # Set environment variables
        MEDIA3_ROOT="$PWD/$PROJECT_NAME"
        set -x
        echo "NDK_PATH=${NDK_PATH}"
        echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"
        ls -la "${NDK_PATH}/" || echo "NDK_PATH dir not found"
        ls "${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -5 || echo "toolchain not found"
        echo "---"
        bash -x ${{ github.workspace }}/.github/scripts/build.sh 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}
        

    - name: Build Media3 AARs
      run: |
          cd media
          echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties
          ./gradlew :lib-decoder-ffmpeg:assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log

    - name: Collect AARs
      run: |
          mkdir -p libs
          cp media/libraries/*/buildout/outputs/aar/*-release.aar libs/
         
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: media3Lib
        path: libs/*
        
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
         name: build-logs
         path: |
            gradle-build.log
            /tmp/build.log
         retention-days: 7

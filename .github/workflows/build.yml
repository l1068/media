name: Media3 library Build

on:
   push:
     branches: [ "test" ]
   pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PROJECT_USER: "WoKee"
      PROJECT_NAME: "media"
      MEDIA3_BRANCH: "release-1.11.0-fongmi"
    
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-java@v5
      with:
          distribution: 'temurin'
          java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
     
    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
          ndk-version: r29
          local-cache: false
          add-to-path: true

    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

    - uses: ilammy/setup-nasm@v1
    - name: Install Meson
      run: pip3 install --user meson

    - name: Build ffmpeg
      continue-on-error: false
      env:
          ANDROID_NDK_HOME: ${{steps.setup-ndk.outputs.ndk-path }}
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
          ROOT_DIR: ${{ github.workspace }}
      run: |       
        echo "*** Setting up Media3 ***"
        git clone -b $MEDIA3_BRANCH https://github.com/$PROJECT_USER/$PROJECT_NAME.git
        
        # Set environment variables
        MEDIA3_ROOT="$PWD/$PROJECT_NAME"
        echo "*** Setting up FFMPEG ***"
        export FFMPEG_MODULE_PATH=$MEDIA3_ROOT/libraries/decoder_ffmpeg/src/main
        export HOST_PLATFORM="linux-x86_64"
        export ANDROID_ABI=21
        export ENABLED_DECODERS=(vorbis opus flac eac3 aac)
        pushd $FFMPEG_MODULE_PATH/jni
        rm -rf ffmpeg
        git clone https://github.com/WoKee/FFmpeg --branch=release-9.0-fongmi --depth=1 ffmpeg
        rm -rf /usr/local/bin/cmake

        cd ffmpeg
        FFMPEG_SRC="$(pwd)"

        # ============================================================
        # 2. Build ArcVideo AV3A SDK for all 4 Android architectures
        # ============================================================
        
        echo "Building ArcVideo AV3A SDK for all architectures..."

        AV3A_SRC="${FFMPEG_SRC}/dependency/avs3a"
        AV3A_BASE="${FFMPEG_SRC}/android-libs/avs3a"
        TOOLCHAIN="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin"
        SYSROOT="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

        # Verify paths
        echo "AV3A_SRC=${AV3A_SRC}"
        ls "${AV3A_SRC}/src/"
        ls "${AV3A_SRC}/include/"
        echo "TOOLCHAIN=${TOOLCHAIN}"
        ls "${TOOLCHAIN}/aarch64-linux-android21-clang"

        build_av3a_for_arch() {
              local arch="$1"
              local target="$2"
              local opt_cflags="$3"
           
              echo "=== Building AV3A for ${arch} (target: ${target}) ==="
              local prefix="${AV3A_BASE}/${arch}"
              mkdir -p "${prefix}/include" "${prefix}/lib"
              local cc="${TOOLCHAIN}/${target}-clang"
           
              # Compile all source files
              local obj_list="${prefix}/lib/objs.txt"
              > "${obj_list}"
              for src in "${AV3A_SRC}/src/"*.c; do
              local base
              base=$(basename "${src}" .c)
              local obj="${prefix}/lib/${base}.o"
              echo "  CC ${base}.c"
              "${cc}" -c "${src}" -o "${obj}" \
              --sysroot="${SYSROOT}" \
              -I"${AV3A_SRC}/include" -I"${AV3A_SRC}/src" \
               ${opt_cflags} -fPIC -O2
               echo "${obj}" >> "${obj_list}"
         done
         
            # Create static library
            echo "  AR libarcdav3a.a"
            "${TOOLCHAIN}/llvm-ar" rcs "${prefix}/lib/libarcdav3a.a" $(cat "${obj_list}")
         
            # Copy headers
            cp "${AV3A_SRC}/include/"*.h "${prefix}/include/"
         
            # Clean object files
            rm -f $(cat "${obj_list}") "${obj_list}"
            echo "  Done: $(ls -lh "${prefix}/lib/libarcdav3a.a")"
        }
        
        build_av3a_for_arch "armeabi-v7a" "armv7a-linux-androideabi21" "-march=armv7-a -mfloat-abi=softfp"
        build_av3a_for_arch "arm64-v8a"  "aarch64-linux-android21"  ""
        build_av3a_for_arch "x86"       "i686-linux-android21"      ""
        build_av3a_for_arch "x86_64"    "x86_64-linux-android21"    ""
        
        echo "All AV3A builds complete!"

        # Enable external libraries (av3a via ArcVideo SDK)
        export ENABLED_EXTERNALS="libarcdav3a"
        echo "NDK path is ${NDK_PATH}"
        echo "FFMPEG_MODULE_PATH is ${FFMPEG_MODULE_PATH}"
        echo "Enabled decoders: ${ENABLED_DECODERS[*]}"
        echo "Enabled externals: ${ENABLED_EXTERNALS}"

        cd "${FFMPEG_MODULE_PATH}/jni"
        
        ./build_ffmpeg.sh "${FFMPEG_MODULE_PATH}" "${NDK_PATH}" "${HOST_PLATFORM}" "${ANDROID_ABI}" "${ENABLED_DECODERS[@]}"

        echo "FFmpeg Build Success"
        # Verify
         for arch in armeabi-v7a arm64-v8a x86 x86_64; do
            echo "--- ${arch} ---"
            ls -lh "${FFMPEG_MODULE_PATH}/jni/ffmpeg/android-libs/${arch}/" 2>/dev/null || echo "NOT FOUND"
         done

        popd
        pushd $PROJECT_NAME
       

    - name: Build Media3 AARs
      run: |
          cd media
          echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties
          ./gradlew bundleReleaseAar --no-daemon --stacktrace 2>&1 | tee gradle-build.log
          
          #./gradlew :lib-decoder-{ffmpeg,av1,flac,iamf,mpegh,opus,vp9}:bundleReleaseAar
          #./gradlew :lib-{common,exoplayer,extractor,ui,session,datasource,decoder,container}:bundleReleaseAar
          #./gradlew :lib-{exoplayer-dash,exoplayer-hls,exoplayer-smoothstreaming,exoplayer-rtsp}:bundleReleaseAar

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
          name: build-logs
          path: |
            gradle-build.log
            /tmp/build.log
          retention-days: 7

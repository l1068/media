name: Media3 library Build

on:
   push:
     branches: [ "build" ]
   pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CMAKE_VER: 3.31.1
      PROJECT_USER: "l1068org"
      PROJECT_NAME: "media"
      MEDIA3_BRANCH: "1.9.0-alpha01-3"
      FFMPEG_BRANCH: "release/6.0"
    
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
          distribution: 'temurin'
          java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
     
    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
          ndk-version: r28c
          local-cache: false
          add-to-path: true

    - uses: ilammy/setup-nasm@v1
    - name: Install Meson
      run: pip3 install --user meson

    - name: Build ffmpeg
      continue-on-error: false
      env:
          ANDROID_NDK_HOME: ${{steps.setup-ndk.outputs.ndk-path }}
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
          ROOT_DIR:  ${{ github.workspace }}
      run: |       
        echo "*** Setting up Media3 ***"
        git clone -b $MEDIA3_BRANCH https://github.com/$PROJECT_USER/$PROJECT_NAME.git
        
        # Set environment variables
        MEDIA3_ROOT="$PWD/$PROJECT_NAME"
        echo "*** Setting up FFMPEG ***"
        export FFMPEG_MODULE_PATH=$MEDIA3_ROOT/libraries/decoder_ffmpeg/src/main
        export HOST_PLATFORM="linux-x86_64"
        export ANDROID_ABI=21
        export ENABLED_DECODERS=(vorbis opus flac alac pcm_mulaw pcm_alaw mp3 amrnb amrwb aac ac3 eac3 dca mlp truehd)
        pushd $FFMPEG_MODULE_PATH/jni
        git clone -b $FFMPEG_BRANCH https://git.ffmpeg.org/ffmpeg.git
        rm -rf /usr/local/bin/cmake
        ./build_ffmpeg.sh "${FFMPEG_MODULE_PATH}" "${NDK_PATH}" "${HOST_PLATFORM}" "${ANDROID_ABI}" "${ENABLED_DECODERS[@]}"
        popd
        pushd $PROJECT_NAME
        
        echo "* Setting up AV1"
        AV1_MODULE_PATH=$MEDIA3_ROOT/libraries/decoder_av1/src/main
        cd "${AV1_MODULE_PATH}/jni" && git clone https://github.com/google/cpu_features -b v0.10.1
        cd "${AV1_MODULE_PATH}/jni" && git clone https://code.videolan.org/videolan/dav1d.git
        ./build_dav1d.sh "${AV1_MODULE_PATH}" "${NDK_PATH}" "${HOST_PLATFORM}"
        popd
        pushd $PROJECT_NAME

        echo "* Setting up Flac decoder module"
        FLAC_MODULE_PATH=$MEDIA3_ROOT/libraries/decoder_flac/src/main          
        cd "${FLAC_MODULE_PATH}/jni" && git clone https://github.com/xiph/flac.git libflac
        popd
        pushd $PROJECT_NAME
        
        echo "* Setting up IAMF decoder AOMediaCodec module"
        IAMF_MODULE_PATH=$MEDIA3_ROOT/libraries/decoder_iamf/src/main          
        cd "${IAMF_MODULE_PATH}/jni" && git clone https://github.com/l1068/libiamf.git
        popd
        pushd $PROJECT_NAME
        
        echo "* Setting up MPEGH decoder module"
        MPEGH_MODULE_PATH=$MEDIA3_ROOT/libraries/decoder_mpegh/src/main        
        cd "${MPEGH_MODULE_PATH}/jni" && git clone https://github.com/Fraunhofer-IIS/mpeghdec.git --branch r3.0.1 libmpegh
        popd
        pushd $PROJECT_NAME

        echo "* Setting up Opus decoder module"
        OPUS_MODULE_PATH=$MEDIA3_ROOT/libraries/decoder_opus/src/main          
        cd "${OPUS_MODULE_PATH}/jni" && git clone https://github.com/xiph/opus.git libopus
        popd
        pushd $PROJECT_NAME

        echo "* Setting up VP9 decoder module"
        VP9_MODULE_PATH=$MEDIA3_ROOT/libraries/decoder_vp9/src/main          
        cd "${VP9_MODULE_PATH}/jni" && git clone --depth=1 -b v1.15.2 https://chromium.googlesource.com/webm/libvpx libvpx
        chmod +x ./generate_libvpx_android_configs.sh
        ./generate_libvpx_android_configs.sh
        ${NDK_PATH}/ndk-build APP_ABI="armeabi-v7a arm64-v8a x86 x86_64" -j4
        popd
        pushd $PROJECT_NAME

        echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
        echo 'org.gradle.caching=true' >> gradle.properties
        echo 'org.gradle.parallel=true' >> gradle.properties
        
        ./gradlew assembleRelease

        popd
        mkdir -p libs
        cp $MEDIA3_ROOT/demos/*/buildout/outputs/apk/*/release/*.apk libs/
        cp $MEDIA3_ROOT/demos/*/buildout/outputs/apk/release/*.apk libs/
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: media3Lib
        path: libs/*

name: Media3 library Build

on:
   push:
     branches: [ "build" ]
   pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PROJECT_NAME: "media"
      FFMPEG_BRANCH: "release/6.0"
    
    steps:

    - name: Checkout Media3
      uses: actions/checkout@v4
      with:
          repository: androidx/media
          ref: release
          path: media

    - name: decoder_ffmpeg
      uses: actions/checkout@v4
      with:
          repository: FFmpeg/FFmpeg
          ref: release/6.0
          path: media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg
          
    - uses: seanmiddleditch/gha-setup-ninja@master

    - uses: actions/setup-java@v1
      with:
         java-version: '17.x'

    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
         cmake-version: '3.16.x'
     
    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
         ndk-version: r26c
         local-cache: true

    - working-directory: media
      run: |
          FFMPEG_MODULE_PATH="${{ github.workspace }}/media/libraries/decoder_ffmpeg/src/main"
          HOST_PLATFORM="linux-x86_64"
          ANDROID_ABI=21
          ENABLED_DECODERS=(vorbis opus flac alac pcm_mulaw pcm_alaw mp3 amrnb amrwb aac ac3 eac3 dca mlp truehd)
          FFMPEG_PATH=${{ github.workspace }}/FFmpeg
          cd "${FFMPEG_MODULE_PATH}/jni"
          ln -s "$FFMPEG_PATH" ffmpeg
          ./build_ffmpeg.sh "${FFMPEG_MODULE_PATH}" "${{steps.setup-ndk.outputs.ndk-path}}" "${HOST_PLATFORM}" "${ANDROID_ABI}" "${ENABLED_DECODERS}"
          cd "${{ github.workspace }}/media"
          ./gradlew bundleReleaseAar

          mkdir -p libs
          cp ${{ github.workspace }}/media/libraries/*/buildout/outputs/aar/*-release.aar libs/
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: media3Lib
        path: libs/*

name: Media3 library Build

on:
   push:
     branches: [ "build" ]
   pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PROJECT_USER: "l1068org"
      PROJECT_NAME: "media"
      MEDIA3_BRANCH: "release-1.8.0-rc02"
      FFMPEG_BRANCH: "release/6.0"
    
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
          distribution: 'zulu'
          java-version: 21
          
    - uses: gradle/actions/setup-gradle@v4
     
    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
           cmake-version: '4.0.2'
     
    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
          ndk-version: r26c
          local-cache: true
        
    - name: Build ffmpeg
      run: |       
        echo "*** Setting up Media3 ***"
        git clone -b $MEDIA3_BRANCH https://github.com/$PROJECT_USER/$PROJECT_NAME.git

        # Set environment variables
        MEDIA3_ROOT="$PWD/$PROJECT_NAME"
        
        echo "* Setting up FFMPEG"
        FFMPEG_MODULE_PATH=$MEDIA3_ROOT/libraries/decoder_ffmpeg/src/main
        HOST_PLATFORM="linux-x86_64"
        ANDROID_ABI=21
        ENABLED_DECODERS=(vorbis opus flac alac pcm_mulaw pcm_alaw mp3 amrnb amrwb aac ac3 eac3 dca mlp truehd)
        pushd $FFMPEG_MODULE_PATH/jni
        git clone -b $FFMPEG_BRANCH https://git.ffmpeg.org/ffmpeg.git
        ./build_ffmpeg.sh "${FFMPEG_MODULE_PATH}" "${{steps.setup-ndk.outputs.ndk-path}}" "${HOST_PLATFORM}" "${ANDROID_ABI}" "${ENABLED_DECODERS[@]}"
        popd
        pushd $PROJECT_NAME
        
        
        ./gradlew bundleReleaseAar
        
        popd
        mkdir -p libs
        cp $MEDIA3_ROOT/libraries/*/buildout/outputs/aar/*-release.aar libs/
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: media3Lib
        path: libs/*
